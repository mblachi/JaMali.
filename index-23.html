<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus POS — Sales &amp; Inventory Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0B0F14; --surface:#121822; --surface-2:#1A2230; --border:#232C3B;
    --ink:#EAF0F7; --muted:#8B97AB;
    --teal:#28E0B9; --teal-dim:#1AA184; --violet:#7C6CF6; --coral:#FF6B5E;
    --danger:#FF6B5E; --success:#28E0B9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh;
  }
  .display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:2px solid var(--teal); outline-offset:1px;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px;}

  .topbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:18px 20px; position:sticky; top:0; z-index:10;
  }
  .topbar-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .home-btn{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--ink);padding:7px 9px;display:none;align-items:center;justify-content:center;
  }
  .home-btn.show{display:flex;}
  .logo-dot{width:10px;height:10px;border-radius:3px;background:var(--teal);display:inline-block;box-shadow:0 0 12px var(--teal);}
  .logo-dot.offline{background:var(--coral);box-shadow:0 0 12px var(--coral);}
  .topbar-title{font-size:20px;font-weight:700;letter-spacing:-.2px;}
  .topbar-date{font-size:11px;color:var(--muted);letter-spacing:.5px;}

  .container{max-width:720px;margin:0 auto;padding:0 0 48px;}
  .section{padding:20px;}

  .stat-row{display:flex;gap:12px;margin-bottom:24px;padding:20px 20px 0;}
  .stat-card{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden;
  }
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .stat-value{font-size:24px;font-weight:700;margin-top:6px;}

  .group{margin-bottom:28px;padding:0 20px;}
  .group-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .group-title::after{content:"";flex:1;height:1px;background:var(--border);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 16px;
    text-align:left;display:flex;flex-direction:column;gap:12px;transition:border-color .15s, transform .15s;
  }
  .tile:hover{border-color:var(--teal-dim);}
  .tile:active{transform:scale(.98);}
  .tile-icon{
    width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);
  }
  .tile span{font-size:14px;font-weight:600;color:var(--ink);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
  .field{display:block;margin-bottom:14px;}
  .field-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;}
  .input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);font-size:15px;background:var(--surface-2);color:var(--ink);}
  .input::placeholder{color:#54606F;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  .btn-primary{
    background:var(--teal);color:#052018;border:none;border-radius:10px;padding:13px 18px;
    font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:center;width:100%;
  }
  .btn-primary:disabled{background:#2B3444;color:#5C6779;}
  .btn-add{
    background:var(--teal);color:#052018;border:none;border-radius:10px;padding:13px 18px;
    font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;
  }
  .btn-ghost{
    background:transparent;color:var(--coral);border:1px solid rgba(255,107,94,.3);border-radius:8px;
    padding:7px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
  }
  .btn-icon{background:none;border:none;color:var(--coral);display:flex;}

  .empty{text-align:center;padding:44px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:14px;margin-top:10px;}
  .empty svg{margin-bottom:8px;opacity:.6;}

  .list-row{display:flex;justify-content:space-between;align-items:center;}
  .item-name{font-weight:700;font-size:15px;}
  .item-sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .amount{font-weight:700;}
  .amount-teal{color:var(--teal);}
  .amount-coral{color:var(--coral);}

  .line-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
  .line-item:last-child{border-bottom:none;}
  .line-total{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:19px;font-weight:800;}

  .bar-row{margin-bottom:14px;}
  .bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .bar-track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:8px;border-radius:4px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);
    border:1px solid var(--teal-dim);color:var(--ink);padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;
    box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  .toast.error{border-color:var(--coral);}

  .expandable{cursor:pointer;}
  .chev{transition:transform .15s;color:var(--muted);}
  .chev.open{transform:rotate(90deg);}
  .detail-panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:none;}
  .detail-panel.open{display:block;}

  .loading-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; z-index:200;
  }

  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <span class="logo-dot" style="width:14px;height:14px"></span>
  <div class="display" style="color:var(--muted);font-size:15px">Connecting to database…</div>
</div>

<div class="topbar" style="display:none" id="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <button class="home-btn" id="homeBtn" aria-label="Back to menu" onclick="goHome()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <span class="logo-dot" id="statusDot"></span>
      <div class="topbar-title display" id="pageTitle">Nexus POS</div>
    </div>
    <div class="topbar-date mono" id="topDate"></div>
  </div>
</div>

<div class="container" id="app" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Supabase connection ---------------- */
const SUPABASE_URL = "https://sgknnrjnalhesenzhbgm.supabase.co";
const SUPABASE_KEY = "sb_publishable_BXgm3pL37NTOWHjTu9zjPQ_SsSeWqyo";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TABLES = { items:"items", customers:"customers", suppliers:"suppliers", invoices:"invoices", purchases:"purchases", returns:"returns", expenses:"expenses" };

let DB = { items:[], customers:[], suppliers:[], invoices:[], purchases:[], returns:[], expenses:[] };

function uid(){ return Math.random().toString(36).slice(2,10); }
function money(n){ return "SAR " + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

let toastTimer;
function notify(msg, isError){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.toggle("error", !!isError); t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}

/* ---- row <-> app-shape mappers ---- */
function invoiceFromRow(r){ return {id:r.id, date:r.date, time:r.time, customerName:r.customer_name, lines:r.lines||[], total:Number(r.total)}; }
function purchaseFromRow(r){ return {id:r.id, date:r.date, supplierName:r.supplier_name, itemName:r.item_name, qty:Number(r.qty), cost:Number(r.cost), total:Number(r.total)}; }
function returnFromRow(r){ return {id:r.id, date:r.date, itemName:r.item_name, qty:Number(r.qty), reason:r.reason, refund:Number(r.refund)}; }

async function loadAll(){
  const [items, customers, suppliers, invoices, purchases, returns, expenses] = await Promise.all([
    sb.from("items").select("*").order("created_at",{ascending:false}),
    sb.from("customers").select("*").order("created_at",{ascending:false}),
    sb.from("suppliers").select("*").order("created_at",{ascending:false}),
    sb.from("invoices").select("*").order("created_at",{ascending:false}),
    sb.from("purchases").select("*").order("created_at",{ascending:false}),
    sb.from("returns").select("*").order("created_at",{ascending:false}),
    sb.from("expenses").select("*").order("created_at",{ascending:false}),
  ]);
  const firstErr = [items,customers,suppliers,invoices,purchases,returns,expenses].find(r=>r.error);
  if(firstErr && firstErr.error){ throw firstErr.error; }
  DB.items = items.data.map(i=>({id:i.id, name:i.name, price:Number(i.price), stock:Number(i.stock), unit:i.unit||"pc"}));
  DB.customers = customers.data.map(c=>({id:c.id, name:c.name, phone:c.phone, notes:c.notes, addedOn:c.added_on}));
  DB.suppliers = suppliers.data.map(s=>({id:s.id, name:s.name, phone:s.phone, notes:s.notes, addedOn:s.added_on}));
  DB.invoices = invoices.data.map(invoiceFromRow);
  DB.purchases = purchases.data.map(purchaseFromRow);
  DB.returns = returns.data.map(returnFromRow);
  DB.expenses = expenses.data.map(e=>({id:e.id, date:e.date, category:e.category, amount:Number(e.amount), note:e.note}));
}

function setStatus(online){
  document.getElementById("statusDot").classList.toggle("offline", !online);
}

/* ---------------- icons ---------------- */
const ICONS = {
  cart: '<path d="M6 6h15l-1.5 9h-13z"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M6 6L4 2H2"/>',
  package: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 7l8.7 5 8.7-5"/><path d="M12 22V12"/>',
  userplus: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M19 8v6M22 11h-6"/>',
  truck: '<rect x="1" y="5" width="14" height="12" rx="1"/><path d="M15 9h4l3 4v4h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  wallet: '<path d="M20 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 7V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2"/><path d="M17 13h.01"/>',
  briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  rotate: '<path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2-9.4L1 10"/>',
  filebar: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15v3M12 13v5M15 11v7"/>',
  trending: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
  chevron: '<polyline points="9 18 15 12 9 6"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
};
function icon(name, size=20, color="currentColor"){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}
const TILE_COLORS = {
  cart:"#28E0B9", search:"#28E0B9", package:"#7C6CF6", userplus:"#7C6CF6", truck:"#7C6CF6",
  wallet:"#FF6B5E", briefcase:"#FF6B5E", rotate:"#FF6B5E", trending:"#28E0B9", filebar:"#FF6B5E",
};

/* ---------------- routing ---------------- */
const MODULES = {
  sale: "New Sale", items: "Items", customers: "Customers", suppliers: "Suppliers",
  invoices: "Search Invoices", spend: "New Spend", purchases: "Purchases",
  returns: "Purchase Returns", expReport: "Expenses Report", salesReport: "Daily Sales Report",
};
let view = "home";
function goHome(){ view = "home"; render(); }
function goTo(v){ view = v; render(); }

document.getElementById("topDate").textContent = todayStr();

function render(){
  document.getElementById("pageTitle").textContent = view === "home" ? "Nexus POS" : MODULES[view];
  document.getElementById("homeBtn").classList.toggle("show", view !== "home");
  const app = document.getElementById("app");
  app.innerHTML = "";
  const renderers = {
    home: renderHome, sale: renderSale, items: renderItems, customers: ()=>renderPeople("customer"),
    suppliers: ()=>renderPeople("supplier"), invoices: renderInvoices, spend: renderSpend,
    purchases: renderPurchases, returns: renderReturns, expReport: renderExpReport, salesReport: renderSalesReport,
  };
  (renderers[view] || renderHome)(app);
}

/* ---------------- HOME ---------------- */
function renderHome(app){
  const t = todayStr();
  const todaySales = DB.invoices.filter(i=>i.date===t).reduce((s,i)=>s+i.total,0);
  const todayExp = DB.expenses.filter(e=>e.date===t).reduce((s,e)=>s+Number(e.amount),0);

  app.innerHTML = `
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Today's sales</div>
        <div class="stat-value display" style="color:var(--teal)">${money(todaySales)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today's spend</div>
        <div class="stat-value display" style="color:var(--coral)">${money(todayExp)}</div>
      </div>
    </div>
    ${group("Sell & Search", [["sale","cart"],["invoices","search"]])}
    ${group("Catalogue & Contacts", [["items","package"],["customers","userplus"],["suppliers","truck"]])}
    ${group("Money Out", [["spend","wallet"],["purchases","briefcase"],["returns","rotate"]])}
    ${group("Reports", [["salesReport","trending"],["expReport","filebar"]])}
  `;
}
function group(title, tiles){
  return `<div class="group">
    <div class="group-title">${title}</div>
    <div class="grid2">
      ${tiles.map(([key,ic])=>`
        <button class="tile" onclick="goTo('${key}')">
          <div class="tile-icon">${icon(ic,18,TILE_COLORS[ic])}</div>
          <span>${MODULES[key]}</span>
        </button>`).join("")}
    </div>
  </div>`;
}

/* ---------------- shared UI helpers ---------------- */
function field(label, inner){ return `<label class="field"><div class="field-label">${label}</div>${inner}</label>`; }
function emptyState(text){ return `<div class="empty">${icon("alert",22,"#8B97AB")}<div style="font-size:14px">${text}</div></div>`; }

/* ---------------- ITEMS ---------------- */
function renderItems(app){
  app.innerHTML = `
    <div class="section">
      <div class="card">
        ${field("Item name", `<input class="input" id="itName" placeholder="e.g. Basmati Rice 5kg">`)}
        <div class="row">
          ${field("Price", `<input class="input" id="itPrice" type="number" placeholder="0.00">`)}
          ${field("Stock qty", `<input class="input" id="itStock" type="number" placeholder="0">`)}
          <div style="max-width:90px">${field("Unit", `<input class="input" id="itUnit" value="pc">`)}</div>
        </div>
        <button class="btn-primary" id="addItemBtn" onclick="addItem()">${icon("plus",16)} Add item</button>
      </div>
      <input class="input" style="margin-bottom:12px" id="itemSearch" placeholder="Search items…" oninput="renderItemsList()">
      <div id="itemsList"></div>
    </div>
  `;
  renderItemsList();
}
async function addItem(){
  const name = document.getElementById("itName").value.trim();
  const price = document.getElementById("itPrice").value;
  const stock = document.getElementById("itStock").value;
  const unit = document.getElementById("itUnit").value.trim() || "pc";
  if(!name || !price){ notify("Name and price are required", true); return; }
  const btn = document.getElementById("addItemBtn"); btn.disabled = true;
  const row = {id:uid(), name, price:Number(price), stock:Number(stock||0), unit};
  const { error } = await sb.from("items").insert(row);
  if(error){ notify("Failed to save: "+error.message, true); btn.disabled=false; return; }
  DB.items.unshift(row);
  notify("Item added"); renderItems(document.getElementById("app"));
}
function renderItemsList(){
  const q = (document.getElementById("itemSearch")?.value || "").toLowerCase();
  const list = DB.items.filter(i=>i.name.toLowerCase().includes(q));
  const el = document.getElementById("itemsList");
  el.innerHTML = list.length===0 ? emptyState("No items yet. Add your first item above.") :
    list.map(i=>`
      <div class="card list-row">
        <div><div class="item-name">${esc(i.name)}</div><div class="item-sub">${money(i.price)} · ${i.stock} ${esc(i.unit)} in stock</div></div>
        <button class="btn-ghost" onclick="removeItem('${i.id}')">${icon("trash",14)}</button>
      </div>`).join("");
}
async function removeItem(id){
  const { error } = await sb.from("items").delete().eq("id", id);
  if(error){ notify("Failed to delete: "+error.message, true); return; }
  DB.items = DB.items.filter(i=>i.id!==id);
  renderItemsList();
}

/* ---------------- PEOPLE ---------------- */
function renderPeople(kind){
  const app = document.getElementById("app");
  const label = kind==="customer" ? "Customer" : "Supplier";
  const listKey = kind==="customer" ? "customers" : "suppliers";
  app.innerHTML = `
    <div class="section">
      <div class="card">
        ${field(label+" name", `<input class="input" id="pName">`)}
        ${field("Phone", `<input class="input" id="pPhone">`)}
        ${field("Notes (optional)", `<input class="input" id="pNotes">`)}
        <button class="btn-primary" id="addPersonBtn" onclick="addPerson('${kind}')">${icon("plus",16)} Add ${label.toLowerCase()}</button>
      </div>
      <div id="peopleList"></div>
    </div>
  `;
  renderPeopleList(kind, listKey);
}
async function addPerson(kind){
  const listKey = kind==="customer" ? "customers" : "suppliers";
  const name = document.getElementById("pName").value.trim();
  if(!name){ notify("Name is required", true); return; }
  const phone = document.getElementById("pPhone").value.trim();
  const notes = document.getElementById("pNotes").value.trim();
  const btn = document.getElementById("addPersonBtn"); btn.disabled = true;
  const row = {id:uid(), name, phone, notes, added_on: todayStr()};
  const { error } = await sb.from(listKey).insert(row);
  if(error){ notify("Failed to save: "+error.message, true); btn.disabled=false; return; }
  DB[listKey].unshift({id:row.id, name, phone, notes, addedOn:row.added_on});
  notify((kind==="customer"?"Customer":"Supplier")+" added");
  renderPeople(kind);
}
function renderPeopleList(kind, listKey){
  const el = document.getElementById("peopleList");
  const list = DB[listKey];
  const label = kind==="customer" ? "customer" : "supplier";
  el.innerHTML = list.length===0 ? emptyState(`No ${label}s yet.`) :
    list.map(p=>`
      <div class="card list-row">
        <div><div class="item-name">${esc(p.name)}</div><div class="item-sub">${esc(p.phone||"No phone")} ${p.notes?"· "+esc(p.notes):""}</div></div>
        <button class="btn-ghost" onclick="removePerson('${listKey}','${p.id}','${kind}')">${icon("trash",14)}</button>
      </div>`).join("");
}
async function removePerson(listKey, id, kind){
  const { error } = await sb.from(listKey).delete().eq("id", id);
  if(error){ notify("Failed to delete: "+error.message, true); return; }
  DB[listKey] = DB[listKey].filter(p=>p.id!==id);
  renderPeopleList(kind, listKey);
}

/* ---------------- NEW SALE ---------------- */
let saleLines = [];
function renderSale(app){
  saleLines = [];
  app.innerHTML = `
    <div class="section">
      <div class="card">
        ${field("Customer (optional)", `<select class="input" id="saleCustomer"><option value="">Walk-in customer</option>${DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>`)}
      </div>
      <div class="card">
        <div class="group-title" style="margin-bottom:10px">Add item</div>
        ${field("Item", `<select class="input" id="salePick"><option value="">Select item…</option>${DB.items.map(i=>`<option value="${i.id}">${esc(i.name)} — ${money(i.price)}</option>`).join("")}</select>`)}
        <div class="row" style="align-items:flex-end">
          ${field("Quantity", `<input class="input" id="saleQty" type="number" min="1" value="1">`)}
          <button class="btn-add" style="margin-bottom:14px" onclick="addSaleLine()">${icon("plus",16)} Add</button>
        </div>
      </div>
      <div id="saleLinesWrap"></div>
      <button class="btn-primary" id="completeBtn" onclick="completeSale()" disabled>${icon("save",16)} Complete sale</button>
    </div>
  `;
  renderSaleLines();
}
function addSaleLine(){
  const pick = document.getElementById("salePick").value;
  const qty = Number(document.getElementById("saleQty").value);
  const item = DB.items.find(i=>i.id===pick);
  if(!item){ notify("Choose an item", true); return; }
  if(!qty || qty<=0){ notify("Quantity must be positive", true); return; }
  saleLines.push({itemId:item.id, name:item.name, price:item.price, qty});
  document.getElementById("salePick").value = "";
  document.getElementById("saleQty").value = 1;
  renderSaleLines();
}
function removeSaleLine(idx){ saleLines.splice(idx,1); renderSaleLines(); }
function renderSaleLines(){
  const wrap = document.getElementById("saleLinesWrap");
  const total = saleLines.reduce((s,l)=>s+l.price*l.qty,0);
  document.getElementById("completeBtn").disabled = saleLines.length===0;
  if(saleLines.length===0){ wrap.innerHTML = emptyState("No items added to this sale yet."); return; }
  wrap.innerHTML = `<div class="card">
    ${saleLines.map((l,idx)=>`
      <div class="line-item">
        <div><div class="item-name" style="font-size:14px">${esc(l.name)}</div><div class="item-sub">${l.qty} × ${money(l.price)}</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="display amount">${money(l.price*l.qty)}</div>
          <button class="btn-icon" onclick="removeSaleLine(${idx})">${icon("x",16)}</button>
        </div>
      </div>`).join("")}
    <div class="line-total display"><span>Total</span><span style="color:var(--teal)">${money(total)}</span></div>
  </div>`;
}
async function completeSale(){
  if(saleLines.length===0){ notify("Add at least one item", true); return; }
  const btn = document.getElementById("completeBtn"); btn.disabled = true;
  const custId = document.getElementById("saleCustomer").value;
  const customer = DB.customers.find(c=>c.id===custId);
  const total = saleLines.reduce((s,l)=>s+l.price*l.qty,0);
  const row = {
    id:uid(), date:todayStr(), time:new Date().toISOString(),
    customer_name: customer?customer.name:"Walk-in", lines:saleLines, total,
  };
  const { error } = await sb.from("invoices").insert(row);
  if(error){ notify("Failed to save sale: "+error.message, true); btn.disabled=false; return; }

  // update stock for each affected item
  for(const line of saleLines){
    const it = DB.items.find(x=>x.id===line.itemId);
    if(it){
      const newStock = Math.max(0, it.stock - line.qty);
      const { error: stockErr } = await sb.from("items").update({stock:newStock}).eq("id", it.id);
      if(!stockErr) it.stock = newStock;
    }
  }
  DB.invoices.unshift(invoiceFromRow(row));
  notify("Sale completed · "+money(total));
  renderSale(document.getElementById("app"));
}

/* ---------------- SEARCH INVOICES ---------------- */
function renderInvoices(app){
  app.innerHTML = `
    <div class="section">
      <input class="input" style="margin-bottom:14px" id="invSearch" placeholder="Search by customer, date, or ID…" oninput="renderInvoicesList()">
      <div id="invList"></div>
    </div>`;
  renderInvoicesList();
}
let openInvoiceId = null;

  const q = (document.getElementById("invSearch")?.value || "").toLowerCase();

          <div><div class="item-name">${esc(inv.customerName)}</div><div class="item-sub mono">${inv.date} · #${inv.id}</div></div>
          <div style="display:flex;align-items:center;gap:6px">
            <div class="display amount amount-teal">${money(inv.total)}</div>
            <span class="chev ${openInvoiceId===inv.id?'open':''}">${icon("chevron",16)}</span>
          </div>
        </div>
        <div class="detail-panel ${openInvoiceId===inv.id?'open':''}">
          ${inv.lines.map(l=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span>${esc(l.name)} × ${l.qty}</span><span>${money(l.price*l.qty)}</span></div>`).join("")}
        </div>
      </div>`).join("");
}
function toggleInvoice(id){ openInvoiceId = openInvoiceId===id ? null : id; renderInvoicesList(); }

/* ---------------- NEW SPEND ---------------- */
const EXPENSE_CATEGORIES = ["Rent","Utilities","Salaries","Transport","Maintenance","Other"];
function renderSpend(app){
  app.innerHTML = `
    <div class="section">
      <div class="card">
        ${field("Category", `<select class="input" id="spCategory">${EXPENSE_CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select>`)}
        ${field("Amount", `<input class="input" id="spAmount" type="number" placeholder="0.00">`)}
        ${field("Note (optional)", `<input class="input" id="spNote">`)}
        <button class="btn-primary" id="addSpendBtn" onclick="addSpend()">${icon("plus",16)} Record spend</button>
      </div>
      <div id="spendList"></div>
    </div>`;
  renderSpendList();
}
async function addSpend(){
  const amount = document.getElementById("spAmount").value;
  if(!amount){ notify("Amount is required", true); return; }
  const btn = document.getElementById("addSpendBtn"); btn.disabled = true;
  const category = document.getElementById("spCategory").value;
  const note = document.getElementById("spNote").value.trim();
  const row = {id:uid(), date:todayStr(), category, amount:Number(amount), note};
  const { error } = await sb.from("expenses").insert(row);
  if(error){ notify("Failed to save: "+error.message, true); btn.disabled=false; return; }
  DB.expenses.unshift(row);
  notify("Spend recorded");
  renderSpend(document.getElementById("app"));
}
function renderSpendList(){
  const el = document.getElementById("spendList");
  el.innerHTML = DB.expenses.slice(0,8).map(e=>`
    <div class="card list-row">
      <div><div class="item-name">${esc(e.category)}</div><div class="item-sub">${e.date} ${e.note?"· "+esc(e.note):""}</div></div>
      <div class="display amount amount-coral">${money(e.amount)}</div>
    </div>`).join("");
}

/* ---------------- PURCHASES ---------------- */
function renderPurchases(app){
  app.innerHTML = `
    <div class="section">
      <div class="card">
        ${field("Supplier", `<select class="input" id="puSupplier"><option value="">Unknown / one-off</option>${DB.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>`)}
        ${field("Item name", `<input class="input" id="puItem" placeholder="Matches existing item name to update stock">`)}
        <div class="row">
          ${field("Quantity", `<input class="input" id="puQty" type="number" value="1">`)}
          ${field("Cost per unit", `<input class="input" id="puCost" type="number">`)}
        </div>
        <button class="btn-primary" id="addPurchaseBtn" onclick="addPurchase()">${icon("plus",16)} Add purchase</button>
      </div>
      <div id="purchaseList"></div>
    </div>`;
  renderPurchaseList();
}
async function addPurchase(){
  const itemName = document.getElementById("puItem").value.trim();
  const cost = document.getElementById("puCost").value;
  if(!itemName || !cost){ notify("Item and cost are required", true); return; }
  const btn = document.getElementById("addPurchaseBtn"); btn.disabled = true;
  const qty = Number(document.getElementById("puQty").value || 1);
  const supplierId = document.getElementById("puSupplier").value;
  const supplier = DB.suppliers.find(s=>s.id===supplierId);
  const row = {id:uid(), date:todayStr(), supplier_name: supplier?supplier.name:"Unknown", item_name:itemName, qty, cost:Number(cost), total: qty*Number(cost)};
  const { error } = await sb.from("purchases").insert(row);
  if(error){ notify("Failed to save: "+error.message, true); btn.disabled=false; return; }
  DB.purchases.unshift(purchaseFromRow(row));
  const existing = DB.items.find(i=>i.name.toLowerCase()===itemName.toLowerCase());
  if(existing){
    const newStock = existing.stock + qty;
    const { error: stockErr } = await sb.from("items").update({stock:newStock}).eq("id", existing.id);
    if(!stockErr) existing.stock = newStock;
  }
  notify("Purchase recorded");
  renderPurchases(document.getElementById("app"));
}
function renderPurchaseList(){
  const el = document.getElementById("purchaseList");
  el.innerHTML = DB.purchases.slice(0,8).map(p=>`
    <div class="card list-row">
      <div><div class="item-name">${esc(p.itemName)}</div><div class="item-sub">${p.date} · ${esc(p.supplierName)} · ${p.qty} units</div></div>
      <div class="display amount">${money(p.total)}</div>
    </div>`).join("");
}

/* ---------------- RETURNS ---------------- */
function renderReturns(app){
  app.innerHTML = `
    <div class="section">
      <div class="card">
        ${field("Original purchase", `<select class="input" id="rtPurchase"><option value="">Select purchase…</option>${DB.purchases.map(p=>`<option value="${p.id}">${esc(p.itemName)} · ${p.date} · ${esc(p.supplierName)}</option>`).join("")}</select>`)}
        ${field("Quantity returned", `<input class="input" id="rtQty" type="number" value="1">`)}
        ${field("Reason (optional)", `<input class="input" id="rtReason">`)}
        <button class="btn-primary" id="addReturnBtn" onclick="addReturn()">${icon("plus",16)} Record return</button>
      </div>
      <div id="returnList"></div>
    </div>`;
  renderReturnList();
}
async function addReturn(){
  const purchaseId = document.getElementById("rtPurchase").value;
  const p = DB.purchases.find(x=>x.id===purchaseId);
  if(!p){ notify("Select a purchase to return against", true); return; }
  const btn = document.getElementById("addReturnBtn"); btn.disabled = true;
  const qty = Number(document.getElementById("rtQty").value || 1);
  const reason = document.getElementById("rtReason").value.trim();
  const row = {id:uid(), date:todayStr(), item_name:p.itemName, qty, reason, refund: qty*p.cost};
  const { error } = await sb.from("returns").insert(row);
  if(error){ notify("Failed to save: "+error.message, true); btn.disabled=false; return; }
  DB.returns.unshift(returnFromRow(row));
  const existing = DB.items.find(i=>i.name.toLowerCase()===p.itemName.toLowerCase());
  if(existing){
    const newStock = Math.max(0, existing.stock - qty);
    const { error: stockErr } = await sb.from("items").update({stock:newStock}).eq("id", existing.id);
    if(!stockErr) existing.stock = newStock;
  }
  notify("Return recorded");
  renderReturns(document.getElementById("app"));
}
function renderReturnList(){
  const el = document.getElementById("returnList");
  el.innerHTML = DB.returns.length===0 ? emptyState("No purchase returns yet.") :
    DB.returns.slice(0,8).map(r=>`
      <div class="card list-row">
        <div><div class="item-name">${esc(r.itemName)}</div><div class="item-sub">${r.date} · ${r.qty} units ${r.reason?"· "+esc(r.reason):""}</div></div>
        <div class="display amount amount-coral">-${money(r.refund)}</div>
      </div>`).join("");
}

/* ---------------- REPORTS ---------------- */
function renderExpReport(app){
  const byCat = {};
  DB.expenses.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + e.amount; });
  const total = DB.expenses.reduce((s,e)=>s+e.amount,0);
  const max = Math.max(1, ...Object.values(byCat));
  const rows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  app.innerHTML = `
    <div class="section">
      <div class="card" style="text-align:center;padding:26px">
        <div class="stat-label">Total recorded spend</div>
        <div class="display" style="font-size:32px;font-weight:800;color:var(--coral);margin-top:6px">${money(total)}</div>
      </div>
      ${rows.length===0 ? emptyState("No expenses recorded yet.") : `<div class="card">
        ${rows.map(([cat,amt])=>`
          <div class="bar-row">
            <div class="bar-head"><span style="font-weight:600">${esc(cat)}</span><span>${money(amt)}</span></div>
            <div class="bar-track"><div class="bar-fill" style="background:var(--violet);width:${(amt/max)*100}%"></div></div>
          </div>`).join("")}
      </div>`}
    </div>`;
}
function renderSalesReport(app){
  const byDate = {};
  DB.invoices.forEach(i=>{ byDate[i.date] = (byDate[i.date]||0) + i.total; });
  const days = Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);
  const t = todayStr();
  const todayTotal = byDate[t] || 0;
  const max = Math.max(1, ...days.map(d=>d[1]));
  app.innerHTML = `
    <div class="section">
      <div class="card" style="text-align:center;padding:26px">
        <div class="stat-label">Today's sales</div>
        <div class="display" style="font-size:32px;font-weight:800;color:var(--teal);margin-top:6px">${money(todayTotal)}</div>
        <div class="item-sub" style="margin-top:4px">${DB.invoices.filter(i=>i.date===t).length} invoices today</div>
      </div>
      ${days.length===0 ? emptyState("No sales recorded yet.") : `<div class="card">
        ${days.map(([date,amt])=>`
          <div class="bar-row">
            <div class="bar-head"><span class="mono" style="font-weight:600">${date}</span><span>${money(amt)}</span></div>
            <div class="bar-track"><div class="bar-fill" style="background:var(--teal);width:${(amt/max)*100}%"></div></div>
          </div>`).join("")}
      </div>`}
    </div>`;
}

/* ---------------- utils ---------------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- boot ---------------- */
(async function boot(){
  try{
    await loadAll();
    setStatus(true);
  }catch(e){
    console.error(e);
    notify("Could not connect to database. Check setup.", true);
    setStatus(false);
  }
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("topbar").style.display = "block";
  document.getElementById("app").style.display = "block";
  render();
})();
</script>
