<style>
  :root{
    --bg:#0B0F14; --surface:#121822; --surface-2:#1A2230; --border:#232C3B;
    --ink:#EAF0F7; --muted:#8B97AB;
    --teal:#28E0B9; --teal-dim:#1AA184; --violet:#7C6CF6; --coral:#FF6B5E;
    --danger:#FF6B5E; --success:#28E0B9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh;
  }
  .display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:2px solid var(--teal); outline-offset:1px;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px;}

  .topbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:18px 20px; position:sticky; top:0; z-index:10;
  }
  .topbar-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .home-btn{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--ink);padding:7px 9px;display:none;align-items:center;justify-content:center;
  }
  .home-btn.show{display:flex;}
  .logo-dot{width:10px;height:10px;border-radius:3px;background:var(--teal);display:inline-block;box-shadow:0 0 12px var(--teal);}
  .logo-dot.offline{background:var(--coral);box-shadow:0 0 12px var(--coral);}
  .topbar-title{font-size:20px;font-weight:700;letter-spacing:-.2px;}
  .topbar-date{font-size:11px;color:var(--muted);letter-spacing:.5px;}

  .container{max-width:720px;margin:0 auto;padding:0 0 48px;}
  .section{padding:20px;}

  .stat-row{display:flex;gap:12px;margin-bottom:24px;padding:20px 20px 0;}
  .stat-card{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden;
  }
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .stat-value{font-size:24px;font-weight:700;margin-top:6px;}

  .group{margin-bottom:28px;padding:0 20px;}
  .group-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .group-title::after{content:"";flex:1;height:1px;background:var(--border);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 16px;
    text-align:left;display:flex;flex-direction:column;gap:12px;transition:border-color .15s, transform .15s;
  }
  .tile:hover{border-color:var(--teal-dim);}
  .tile:active{transform:scale(.98);}
  .tile-icon{
    width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);
  }
  .tile span{font-size:14px;font-weight:600;color:var(--ink);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
  .field{display:block;margin-bottom:14px;}
  .field-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;}
  .input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);font-size:15px;background:var(--surface-2);color:var(--ink);}
  .input::placeholder{color:#54606F;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  .btn-primary{
    background:var(--teal);color:#052018;border:none;border-radius:10px;padding:13px 18px;
    font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:center;width:100%;
  }
  .btn-primary:disabled{background:#2B3444;color:#5C6779;}
  .btn-add{
    background:var(--teal);color:#052018;border:none;border-radius:10px;padding:13px 18px;
    font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;
  }
  .btn-ghost{
    background:transparent;color:var(--coral);border:1px solid rgba(255,107,94,.3);border-radius:8px;
    padding:7px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
  }
  .btn-icon{background:none;border:none;color:var(--coral);display:flex;}

  .empty{text-align:center;padding:44px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:14px;margin-top:10px;}
  .empty svg{margin-bottom:8px;opacity:.6;}

  .list-row{display:flex;justify-content:space-between;align-items:center;}
  .item-name{font-weight:700;font-size:15px;}
  .item-sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .amount{font-weight:700;}
  .amount-teal{color:var(--teal);}
  .amount-coral{color:var(--coral);}

  .line-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
  .line-item:last-child{border-bottom:none;}
  .line-total{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:19px;font-weight:800;}

  .bar-row{margin-bottom:14px;}
  .bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .bar-track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:8px;border-radius:4px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);
    border:1px solid var(--teal-dim);color:var(--ink);padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;
    box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  .toast.error{border-color:var(--coral);}

  .expandable{cursor:pointer;}
  .chev{transition:transform .15s;color:var(--muted);}
  .chev.open{transform:rotate(90deg);}
  .detail-panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:none;}
  .detail-panel.open{display:block;}

  .loading-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; z-index:200;
  }
  .login-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    z-index:190; padding:20px;
  }
  .login-box{ width:100%; max-width:360px; }
  .login-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .login-tab{
    flex:1; padding:10px; text-align:center; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); font-weight:700; font-size:13px;
  }
  .login-tab.active{ background:var(--teal); color:#052018; border-color:var(--teal); }
  .link-btn{ background:none; border:none; color:var(--teal); font-size:13px; font-weight:600; text-decoration:underline; padding:0; }

  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}

  /* ---- Print / PDF invoice ---- */
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{
      display:block; position:absolute; top:0; left:0; width:100%;
      padding:24px; color:#000; font-family:'Manrope',sans-serif;
    }
    .print-title{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-bottom:2px; }
    .print-sub{ color:#555; font-size:12px; margin-bottom:18px; }
    .print-table{ width:100%; border-collapse:collapse; margin-top:10px; }
    .print-table th, .print-table td{ text-align:left; padding:8px 4px; border-bottom:1px solid #ccc; font-size:13px; }
    .print-total{ display:flex; justify-content:space-between; margin-top:16px; padding-top:12px; border-top:2px solid #000; font-size:17px; font-weight:700; }
    .print-meta{ display:flex; justify-content:space-between; margin-bottom:14px; font-size:13px; color:#333; }
  }
</style>
</head>

<div class="loading-screen" id="loadingScreen">

<div class="login-screen" id="loginScreen" style="display:none">

      <div id="loginSubtitle" style="color:var(--muted);font-size:13px;margin-top:4px">Staff sign in</div>
    </div>
    <div class="login-tabs">

      <button class="login-tab" id="tabSignUp" onclick="setAuthMode('signup')">Create Account</button>
    </div>
    <div class="card">

      <button class="btn-primary" id="authBtn" onclick="submitAuth()">Sign In</button>
      <div id="authError" style="color:var(--coral);font-size:13px;margin-top:10px;display:none"></div>
    </div>
  </div>
</div>

<div class="topbar" style="display:none" id="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <button class="home-btn" id="homeBtn" aria-label="Back to menu" onclick="goHome()">

      </button>

      <div class="topbar-title display" id="pageTitle">Nexus POS</div>
    </div>
    <div class="topbar-date mono" id="topDate"></div>
  </div>
</div>

<div class="container" id="app" style="display:none"></div>
<div id="printArea"></div>

let authMode = "signin";
let currentUser = null;

function setAuthMode(mode){
  authMode = mode;
  document.getElementById("tabSignIn").classList.toggle("active", mode==="signin");
  document.getElementById("tabSignUp").classList.toggle("active", mode==="signup");
  document.getElementById("authBtn").textContent = mode==="signin" ? t("signIn") : t("createAccount");
  document.getElementById("authError").style.display = "none";
}
async function submitAuth(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const errBox = document.getElementById("authError");
  errBox.style.display = "none";
  if(!email || !password){ errBox.textContent = "Email and password are required"; errBox.style.display="block"; return; }
  const btn = document.getElementById("authBtn"); btn.disabled = true;
  let result;
  if(authMode === "signin"){
    result = await sb.auth.signInWithPassword({ email, password });
  } else {
    result = await sb.auth.signUp({ email, password });
  }
  btn.disabled = false;
  if(result.error){ errBox.textContent = result.error.message; errBox.style.display = "block"; return; }
  if(authMode === "signup" && !result.data.session){
    errBox.style.color = "var(--teal)";
    errBox.textContent = t("accountCreated");
    errBox.style.display = "block";
    return;
  }
  currentUser = result.data.user;
  startApp();
}

  await sb.auth.signOut();

async function loadAll(){
  const [items, customers, suppliers, invoices, purchases, returns, expenses, staff, salaries, priceOffers, notes, branches, customerPayments] = await Promise.all([
    sb.from("items").select("*").order("created_at",{ascending:false}),
    sb.from("customers").select("*").order("created_at",{ascending:false}),
    sb.from("suppliers").select("*").order("created_at",{ascending:false}),
    sb.from("invoices").select("*").order("created_at",{ascending:false}),
    sb.from("purchases").select("*").order("created_at",{ascending:false}),
    sb.from("returns").select("*").order("created_at",{ascending:false}),
    sb.from("expenses").select("*").order("created_at",{ascending:false}),
    sb.from("staff").select("*").order("created_at",{ascending:false}),
    sb.from("salaries").select("*").order("created_at",{ascending:false}),
    sb.from("price_offers").select("*").order("created_at",{ascending:false}),
    sb.from("notes").select("*").order("created_at",{ascending:false}),
    sb.from("branches").select("*").order("created_at",{ascending:false}),
    sb.from("customer_payments").select("*").order("created_at",{ascending:false}),
  ]);
  const all = [items,customers,suppliers,invoices,purchases,returns,expenses,staff,salaries,priceOffers,notes,branches,customerPayments];
  const firstErr = all.find(r=>r.error);
  if(firstErr && firstErr.error){ throw firstErr.error; }
  DB.items = items.data.map(i=>({id:i.id, name:i.name, price:Number(i.price), stock:Number(i.stock), unit:i.unit||"pc", branchId:i.branch_id||null, cost:Number(i.cost||0), reorderPoint:Number(i.reorder_point!=null?i.reorder_point:5)}));
  DB.customers = customers.data.map(c=>({id:c.id, name:c.name, phone:c.phone, notes:c.notes, addedOn:c.added_on, taxNumber:c.tax_number||null}));
  DB.suppliers = suppliers.data.map(s=>({id:s.id, name:s.name, phone:s.phone, notes:s.notes, addedOn:s.added_on}));
  DB.invoices = invoices.data.map(invoiceFromRow);
  DB.purchases = purchases.data.map(purchaseFromRow);
  DB.returns = returns.data.map(returnFromRow);
  DB.expenses = expenses.data.map(e=>({id:e.id, date:e.date, category:e.category, amount:Number(e.amount), note:e.note, branchId:e.branch_id||null, paymentMethod:e.payment_method||"cash"}));
  DB.staff = staff.data.map(s=>({id:s.id, name:s.name, role:s.role, phone:s.phone}));
  DB.salaries = salaries.data.map(s=>({id:s.id, staffId:s.staff_id, staffName:s.staff_name, amount:Number(s.amount), month:s.month, date:s.date}));
  DB.priceOffers = priceOffers.data.map(p=>({id:p.id, customerName:p.customer_name, itemName:p.item_name, price:Number(p.price), validUntil:p.valid_until, note:p.note}));
  DB.notes = notes.data.map(n=>({id:n.id, author:n.author, message:n.message, createdAt:n.created_at}));
  DB.branches = branches.data.map(b=>({id:b.id, name:b.name}));
  DB.customerPayments = customerPayments.data.map(p=>({id:p.id, customerName:p.customer_name, amount:Number(p.amount), date:p.date, note:p.note, paymentMethod:p.payment_method||"cash"}));

  const { data: settingsRows } = await sb.from("settings").select("*");
  DB.settingsMap = {};
  (settingsRows||[]).forEach(r=>{ DB.settingsMap[r.key] = r.value; });
  APP_BUSINESS_NAME = DB.settingsMap.business_name || "Nexus POS";
  APP_CURRENCY = DB.settingsMap.currency || "SAR";
  APP_TAX_RATE = DB.settingsMap.tax_rate!=null ? Number(DB.settingsMap.tax_rate) : 15;
}

async function addItem(){
  const name = document.getElementById("itName").value.trim();
  const price = document.getElementById("itPrice").value;
  const stock = document.getElementById("itStock").value;
  const unit = document.getElementById("itUnit").value.trim() || "pc";
  const cost = document.getElementById("itCost").value;
  const reorderPoint = document.getElementById("itReorder").value;
  if(!name || !price){ notify("Name and price are required", true); return; }
  const btn = document.getElementById("addItemBtn"); btn.disabled = true;
  const row = {id:uid(), name, price:Number(price), stock:Number(stock||0), unit, branch_id: currentBranchId || null, cost:Number(cost||0), reorder_point:Number(reorderPoint||5)};
  const { error } = await sb.from("items").insert(row);
  if(error){ notify("Failed to save: "+error.message, true); btn.disabled=false; return; }
  DB.items.unshift({...row, branchId: row.branch_id, reorderPoint: row.reorder_point});
  notify("Item added"); renderItems(document.getElementById("app"));
}
function renderItemsList(){
  const q = (document.getElementById("itemSearch")?.value || "").toLowerCase();
  const list = itemsForCurrentBranch().filter(i=>i.name.toLowerCase().includes(q));
  const el = document.getElementById("itemsList");
  el.innerHTML = list.length===0 ? emptyState("No items yet. Add your first item above.") :
    list.map(i=>{
      const low = i.stock <= (i.reorderPoint!=null?i.reorderPoint:5);
      return `
      <div class="card">
        <div class="list-row">
          <div>
            <div class="item-name">${esc(i.name)} ${low?`<span style="color:var(--coral);font-size:11px;font-weight:700;margin-left:6px">${t("lowStock")}</span>`:''}</div>
            <div class="item-sub">${money(i.price)} · ${i.stock} ${esc(i.unit)} in stock</div>
          </div>
          <button class="btn-ghost" onclick="confirmRemoveItem('${i.id}','${esc(i.name).replace(/'/g,"\\'")}')">${icon("trash",14)}</button>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn-add" style="flex:1;padding:8px" onclick="adjustStock('${i.id}',-1)">−1</button>
          <button class="btn-add" style="flex:1;padding:8px" onclick="adjustStock('${i.id}',1)">+1</button>
          <button class="btn-add" style="flex:1;padding:8px" onclick="adjustStock('${i.id}',10)">+10</button>
        </div>
      </div>`;
    }).join("");
}
function confirmRemoveItem(id, name){
  if(confirm(`Delete "${name}"? This cannot be undone.`)){ removeItem(id); }
}
async function adjustStock(id, delta){
  const item = DB.items.find(i=>i.id===id);
  if(!item) return;
  const newStock = Math.max(0, item.stock + delta);
  const { error } = await sb.from("items").update({stock:newStock}).eq("id", id);
  if(error){ notify("Failed: "+error.message, true); return; }
  item.stock = newStock;
  renderItemsList();
}
async function removeItem(id){
  const { error } = await sb.from("items").delete().eq("id", id);
  if(error){ notify("Failed to delete: "+error.message, true); return; }
  DB.items = DB.items.filter(i=>i.id!==id);
  renderItemsList();
}

let saleLines = [];

function renderSale(app){

        ${field(t("item"), `<select class="input" id="salePick"><option value="">Select item…</option>${itemsForCurrentBranch().map(i=>`<option value="${i.id}">${esc(i.name)} — ${money(i.price)}</option>`).join("")}</select>`)}
        <div class="row" style="align-items:flex-end">
          ${field(t("quantity"), `<input class="input" id="saleQty" type="number" min="1" value="1">`)}
          <button class="btn-add" style="margin-bottom:14px" onclick="addSaleLine()">${icon("plus",16)} ${t("add")}</button>
        </div>
      </div>
      <div id="saleLinesWrap"></div>
      <button class="btn-primary" id="completeBtn" onclick="completeSale()" disabled>${icon("save",16)} ${t("completeSale")}</button>
    </div>
  `;
  renderSaleLines();
}
function togglePaidAmount(){
  const mode = document.getElementById("salePayment").value;
  document.getElementById("paidAmountWrap").style.display = mode==="credit" ? "block" : "none";
}
function itemsForCurrentBranch(){
  return DB.items.filter(i => !currentBranchId || !i.branchId || i.branchId===currentBranchId);
}
function addSaleLine(){
  const pick = document.getElementById("salePick").value;
  const qty = Number(document.getElementById("saleQty").value);
  const item = DB.items.find(i=>i.id===pick);
  if(!item){ notify("Choose an item", true); return; }
  if(!qty || qty<=0){ notify("Quantity must be positive", true); return; }
  saleLines.push({itemId:item.id, name:item.name, price:item.price, qty});
  document.getElementById("salePick").value = "";
  document.getElementById("saleQty").value = 1;
  renderSaleLines();
}
function removeSaleLine(idx){ saleLines.splice(idx,1); renderSaleLines(); }
function renderSaleLines(){
  const wrap = document.getElementById("saleLinesWrap");
  const subtotal = saleLines.reduce((s,l)=>s+l.price*l.qty,0);
  const taxAmount = subtotal * (APP_TAX_RATE/100);
  const total = subtotal + taxAmount;
  document.getElementById("completeBtn").disabled = saleLines.length===0;
  if(saleLines.length===0){ wrap.innerHTML = emptyState("No items added to this sale yet."); return; }
  wrap.innerHTML = `<div class="card">
    ${saleLines.map((l,idx)=>`
      <div class="line-item">
        <div><div class="item-name" style="font-size:14px">${esc(l.name)}</div><div class="item-sub">${l.qty} × ${money(l.price)}</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="display amount">${money(l.price*l.qty)}</div>
          <button class="btn-icon" onclick="removeSaleLine(${idx})">${icon("x",16)}</button>
        </div>
      </div>`).join("")}
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:12px"><span>${t("subtotal")}</span><span>${money(subtotal)}</span></div>
    ${APP_TAX_RATE>0 ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px"><span>${t("tax")} (${APP_TAX_RATE}%)</span><span>${money(taxAmount)}</span></div>` : ""}
    <div class="line-total display"><span>${t("total")}</span><span style="color:var(--teal)">${money(total)}</span></div>
  </div>`;
}
async function completeSale(){
  if(saleLines.length===0){ notify("Add at least one item", true); return; }
  const btn = document.getElementById("completeBtn"); btn.disabled = true;
  const custId = document.getElementById("saleCustomer").value;
  const customer = DB.customers.find(c=>c.id===custId);
  const subtotal = saleLines.reduce((s,l)=>s+l.price*l.qty,0);
  const taxAmount = subtotal * (APP_TAX_RATE/100);
  const total = subtotal + taxAmount;
  const paymentMode = document.getElementById("salePayment").value;
  let amountPaid = total;
  let paymentStatus = "paid";
  if(paymentMode === "credit"){
    amountPaid = Number(document.getElementById("salePaidAmount").value || 0);
    paymentStatus = amountPaid <= 0 ? "credit" : (amountPaid < total ? "partial" : "paid");
  }
  const { data: numData, error: numErr } = await sb.rpc("next_invoice_number");
  const invoiceNumber = (!numErr && numData) ? numData : ("INV-"+Date.now());
  const row = {
    id:uid(), invoice_number: invoiceNumber, date:todayStr(), time:new Date().toISOString(),
    customer_name: customer?customer.name:"Walk-in", lines:saleLines,
    subtotal, tax_rate:APP_TAX_RATE, tax_amount:taxAmount, total,
    amount_paid: amountPaid, payment_status: paymentStatus, branch_id: currentBranchId || null,
    payment_method: document.getElementById("salePaymentMethod").value,
  };
  const { error } = await sb.from("invoices").insert(row);
  if(error){ notify("Failed to save sale: "+error.message, true); btn.disabled=false; return; }

  // update stock for each affected item
  for(const line of saleLines){
    const it = DB.items.find(x=>x.id===line.itemId);
    if(it){
      const newStock = Math.max(0, it.stock - line.qty);
      const { error: stockErr } = await sb.from("items").update({stock:newStock}).eq("id", it.id);
      if(!stockErr) it.stock = newStock;
    }
  }
  DB.invoices.unshift(invoiceFromRow(row));
  lastCompletedInvoiceId = row.id;
  notify("Sale completed · "+money(total));
  renderSale(document.getElementById("app"));
}

      </div>
      <div id="excelResult"></div>

function importExcel(){
  const fileInput = document.getElementById("excelFile");
  const file = fileInput.files[0];
  if(!file){ notify("Choose a file first", true); return; }
  const btn = document.getElementById("excelBtn"); btn.disabled = true;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const wb = XLSX.read(e.target.result, {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet);
      const newItems = rows.filter(r=>r.name && r.price!=null).map(r=>({
        id:uid(), name:String(r.name), price:Number(r.price), stock:Number(r.stock||0), unit:String(r.unit||"pc"),
      }));
      if(newItems.length===0){ notify("No valid rows found (need name + price columns)", true); btn.disabled=false; return; }
      const { error } = await sb.from("items").insert(newItems);
      btn.disabled = false;
      if(error){ notify("Import failed: "+error.message, true); return; }
      DB.items.unshift(...newItems);
      document.getElementById("excelResult").innerHTML = `<div class="card">${icon("save",16,"var(--teal)")} <span style="margin-left:8px">${newItems.length} items imported successfully.</span></div>`;
      notify(`${newItems.length} items imported`);
    }catch(err){
      btn.disabled = false;
      notify("Could not read file: "+err.message, true);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------------- CUSTOMER CREDIT / LEDGER ---------------- */
function computeCustomerBalances(){
  const balances = {};
  DB.invoices.forEach(inv=>{
    if(inv.customerName==="Walk-in") return;
    const paid = inv.amountPaid!=null ? inv.amountPaid : inv.total;
    const owed = inv.total - paid;
    if(owed===0 && !balances[inv.customerName]) return;
    balances[inv.customerName] = (balances[inv.customerName]||0) + owed;
  });
  DB.customerPayments.forEach(p=>{
    balances[p.customerName] = (balances[p.customerName]||0) - p.amount;
  });
  return Object.entries(balances).filter(([,bal])=>Math.abs(bal)>0.005).sort((a,b)=>b[1]-a[1]);
}
function renderLedger(app){
  const balances = computeCustomerBalances();
  const totalOwed = balances.reduce((s,[,b])=>s+Math.max(0,b),0);
  app.innerHTML = `

/* ---------------- CASH & NETWORK TREASURY ---------------- */
function computeTreasury(method){
  const inFromSales = DB.invoices.filter(i=>(i.paymentMethod||"cash")===method).reduce((s,i)=>s+(i.amountPaid!=null?i.amountPaid:i.total),0);
  const inFromPayments = DB.customerPayments.filter(p=>(p.paymentMethod||"cash")===method).reduce((s,p)=>s+p.amount,0);
  const outExpenses = DB.expenses.filter(e=>(e.paymentMethod||"cash")===method).reduce((s,e)=>s+e.amount,0);
  const outPurchases = DB.purchases.filter(p=>(p.paymentMethod||"cash")===method).reduce((s,p)=>s+p.total,0);
  return inFromSales + inFromPayments - outExpenses - outPurchases;
}
function renderTreasury(app){
  const cash = computeTreasury("cash");
  const network = computeTreasury("network");
  const today_ = todayStr();
  const cashToday = DB.invoices.filter(i=>i.date===today_ && (i.paymentMethod||"cash")==="cash").reduce((s,i)=>s+(i.amountPaid!=null?i.amountPaid:i.total),0);
  const networkToday = DB.invoices.filter(i=>i.date===today_ && (i.paymentMethod||"cash")==="network").reduce((s,i)=>s+(i.amountPaid!=null?i.amountPaid:i.total),0);
  app.innerHTML = `
    <div class="section">
      <div class="card" style="text-align:center;padding:22px">
        <div class="stat-label">Cash Treasury</div>
        <div class="display" style="font-size:28px;font-weight:800;color:var(--teal);margin-top:6px">${money(cash)}</div>
        <div class="item-sub" style="margin-top:6px">${money(cashToday)} received today</div>
      </div>
      <div class="card" style="text-align:center;padding:22px">
        <div class="stat-label">Network / Card Treasury</div>
        <div class="display" style="font-size:28px;font-weight:800;color:var(--violet);margin-top:6px">${money(network)}</div>
        <div class="item-sub" style="margin-top:6px">${money(networkToday)} received today</div>
      </div>
      <div class="card">
        <div class="item-sub">Treasury balances = money received from sales and customer payments, minus expenses and purchases paid through that method.</div>
      </div>
    </div>`;
}

/* ---------------- NET PROFIT REPORT ---------------- */
function computeProfit(invoicesList, expensesList){
  const grossProfit = invoicesList.reduce((sum, inv) => {
    const lineProfit = inv.lines.reduce((s,l)=>{
      const item = DB.items.find(i=>i.id===l.itemId);
      const cost = item ? item.cost : 0;
      return s + (l.price - cost) * l.qty;
    }, 0);
    return sum + lineProfit;
  }, 0);
  const totalExpenses = expensesList.reduce((s,e)=>s+e.amount,0);
  return grossProfit - totalExpenses;
}
function renderProfitReport(app){
  const today_ = todayStr();
  const todayInvoices = DB.invoices.filter(i=>i.date===today_);
  const todayExpenses = DB.expenses.filter(e=>e.date===today_);
  const todayProfit = computeProfit(todayInvoices, todayExpenses);
  const allProfit = computeProfit(DB.invoices, DB.expenses);
  const hasCostData = DB.items.some(i=>i.cost>0);
  app.innerHTML = `
    <div class="section">
      ${!hasCostData ? `<div class="card" style="border-color:var(--brass,var(--coral))"><div class="item-sub">Tip: add a cost price to your items (Items page) for accurate profit numbers. Without cost prices, profit is estimated as full sale value.</div></div>` : ""}
      <div class="card" style="text-align:center;padding:22px">
        <div class="stat-label">Today's net profit</div>
        <div class="display" style="font-size:28px;font-weight:800;color:${todayProfit>=0?'var(--teal)':'var(--coral)'};margin-top:6px">${money(todayProfit)}</div>
      </div>
      <div class="card" style="text-align:center;padding:22px">
        <div class="stat-label">All-time net profit</div>
        <div class="display" style="font-size:28px;font-weight:800;color:${allProfit>=0?'var(--teal)':'var(--coral)'};margin-top:6px">${money(allProfit)}</div>
      </div>
      <div class="card">
        <div class="item-sub">Net profit = (sale price − cost price) × quantity sold, summed across all sales, minus recorded expenses.</div>
      </div>
    </div>`;
}

/* ---------------- INVENTORY REPORT ---------------- */
function renderInventoryReport(app){
  const list = itemsForCurrentBranch();
  const retailValue = list.reduce((s,i)=>s+i.price*i.stock,0);
  const costValue = list.reduce((s,i)=>s+(i.cost||0)*i.stock,0);
  const totalUnits = list.reduce((s,i)=>s+i.stock,0);
  const lowCount = list.filter(i=>i.stock<=(i.reorderPoint!=null?i.reorderPoint:5)).length;
  const sorted = [...list].sort((a,b)=>(b.price*b.stock)-(a.price*a.stock));
  app.innerHTML = `
    <div class="section">
      <div class="stat-row" style="padding:0;margin-bottom:12px">
        <div class="stat-card">
          <div class="stat-label">Stock value (retail)</div>
          <div class="stat-value display" style="color:var(--teal)">${money(retailValue)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Stock value (cost)</div>
          <div class="stat-value display" style="color:var(--violet)">${money(costValue)}</div>
        </div>
      </div>
      <div class="card" style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)">
        <span>${list.length} items · ${totalUnits} units total</span>
        <span style="color:var(--coral)">${lowCount} at re-order point</span>
      </div>
      ${sorted.length===0 ? emptyState("No items yet.") : sorted.slice(0,30).map(i=>`
        <div class="card list-row">
          <div><div class="item-name">${esc(i.name)}</div><div class="item-sub">${i.stock} ${esc(i.unit)} × ${money(i.price)}</div></div>
          <div class="display amount">${money(i.price*i.stock)}</div>
        </div>`).join("")}
    </div>`;
}

/* ---------------- FINANCIAL POSITION ---------------- */
function renderFinancialPosition(app){
  const cash = computeTreasury("cash");
  const network = computeTreasury("network");
  const list = itemsForCurrentBranch();
  const inventoryValue = list.reduce((s,i)=>s+(i.cost||0)*i.stock,0);
  const receivables = computeCustomerBalances().reduce((s,[,bal])=>s+Math.max(0,bal),0);
  const totalAssets = cash + network + inventoryValue + receivables;
  app.innerHTML = `
    <div class="section">
      <div class="card" style="text-align:center;padding:22px">
        <div class="stat-label">Total assets</div>
        <div class="display" style="font-size:30px;font-weight:800;color:var(--teal);margin-top:6px">${money(totalAssets)}</div>
      </div>
      <div class="card">
        <div class="line-item"><span>Cash treasury</span><span>${money(cash)}</span></div>
        <div class="line-item"><span>Network / card treasury</span><span>${money(network)}</span></div>
        <div class="line-item"><span>Inventory value (at cost)</span><span>${money(inventoryValue)}</span></div>
        <div class="line-item" style="border-bottom:none"><span>Customer receivables (credit owed)</span><span>${money(receivables)}</span></div>
      </div>
      <div class="card">
        <div class="item-sub">A simple snapshot of what the business currently holds: cash, card balances, inventory value, and money owed by customers.</div>
      </div>
    </div>`;
}

/* ---------------- TOP SELLING ITEMS ---------------- */
function renderTopItems(app){
  const totals = {};
  DB.invoices.forEach(inv=>{
    inv.lines.forEach(l=>{
      if(!totals[l.name]) totals[l.name] = { qty:0, revenue:0 };
      totals[l.name].qty += l.qty;
      totals[l.name].revenue += l.price*l.qty;
    });
  });
  const sorted = Object.entries(totals).sort((a,b)=>b[1].qty-a[1].qty);
  app.innerHTML = `
    <div class="section">
      ${sorted.length===0 ? emptyState("No sales recorded yet.") : sorted.slice(0,30).map(([name,d],idx)=>`
        <div class="card list-row">
          <div><div class="item-name">${idx+1}. ${esc(name)}</div><div class="item-sub">${d.qty} units sold</div></div>
          <div class="display amount amount-teal">${money(d.revenue)}</div>
        </div>`).join("")}
    </div>`;
}



function tlvBytes(tag, value){
  const valueBytes = new TextEncoder().encode(String(value||""));
  const out = new Uint8Array(2 + valueBytes.length);
  out[0] = tag; out[1] = valueBytes.length; out.set(valueBytes, 2);
  return out;
}
function buildZatcaQrBase64(seller, vat, timestampISO, total, vatAmount){
  const parts = [
    tlvBytes(1, seller), tlvBytes(2, vat), tlvBytes(3, timestampISO),
    tlvBytes(4, total.toFixed(2)), tlvBytes(5, vatAmount.toFixed(2)),
  ];
  const totalLen = parts.reduce((s,p)=>s+p.length,0);
  const buf = new Uint8Array(totalLen);
  let offset = 0;
  parts.forEach(p=>{ buf.set(p, offset); offset += p.length; });
  let binary = "";
  buf.forEach(b=>binary += String.fromCharCode(b));
  return btoa(binary);
}
async function printInvoice(invoiceId){
  const inv = DB.invoices.find(i=>i.id===invoiceId);
  if(!inv){ notify("Invoice not found", true); return; }
  const businessName = APP_BUSINESS_NAME;
  const vatNumber = DB.settingsMap.vat_number || "";
  const crNumber = DB.settingsMap.cr_number || "";
  const customer = DB.customers.find(c=>c.name===inv.customerName);
  const rowsHtml = inv.lines.map(l=>`
    <tr>
      <td>${esc(l.name)}</td>
      <td>${l.qty}</td>
      <td>${money(l.price)}</td>
      <td>${money(l.price*l.qty)}</td>
    </tr>`).join("");

  let qrImgHtml = "";
  try{
    const qrBase64 = buildZatcaQrBase64(businessName, vatNumber, inv.time||new Date().toISOString(), inv.total, inv.taxAmount||0);
    const qrDataUrl = await QRCode.toDataURL(qrBase64, {margin:1, width:140});
    qrImgHtml = `<div style="text-align:center;margin-top:16px"><img src="${qrDataUrl}" style="width:120px;height:120px" /></div>`;
  }catch(e){ console.error("QR generation failed", e); }

  document.getElementById("printArea").innerHTML = `
    <div class="print-title">${esc(businessName)}</div>
    <div class="print-sub">Sales Invoice</div>
    ${(vatNumber || crNumber) ? `<div style="font-size:11px;color:#555;margin-bottom:10px">${vatNumber?`VAT No: ${esc(vatNumber)}`:""} ${vatNumber && crNumber?"· ":""} ${crNumber?`CR No: ${esc(crNumber)}`:""}</div>` : ""}
    <div class="print-meta">
      <div>Invoice ${esc(inv.invoiceNumber)}<br>${esc(inv.date)}</div>
      <div style="text-align:right">Customer:<br><b>${esc(inv.customerName)}</b>${customer && customer.taxNumber ? `<br><span style="font-size:11px">VAT: ${esc(customer.taxNumber)}</span>` : ""}</div>
    </div>
    <table class="print-table">
      <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#444;margin-top:10px"><span>Subtotal</span><span>${money(inv.subtotal!=null?inv.subtotal:inv.total)}</span></div>
    ${inv.taxRate>0 ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:#444;margin-top:4px"><span>VAT (${inv.taxRate}%)</span><span>${money(inv.taxAmount||0)}</span></div>` : ""}
    <div class="print-total"><span>Total</span><span>${money(inv.total)}</span></div>
    ${qrImgHtml}
  `;
  window.print();
}

async function printQuotation(singleOfferId){
  let offers;
  let quotationCustomerName = "";
  if(singleOfferId){
    const one = DB.priceOffers.find(p=>p.id===singleOfferId);
    if(!one){ notify("Offer not found", true); return; }
    offers = [one];
    quotationCustomerName = one.customerName || "";
  } else {
    offers = getFilteredPriceOffers();
    if(offers.length===0){ notify("No offers to print for this selection", true); return; }
    const filter = document.getElementById("poFilterCustomer")?.value || "__all";
    quotationCustomerName = (filter!=="__all" && filter!=="__general") ? filter : "";
  }
  const businessName = APP_BUSINESS_NAME;
  const vatNumber = DB.settingsMap.vat_number || "";
  const crNumber = DB.settingsMap.cr_number || "";
  const customer = quotationCustomerName ? DB.customers.find(c=>c.name===quotationCustomerName) : null;
  const subtotal = offers.reduce((s,o)=>s+Number(o.price||0),0);
  const taxAmount = subtotal * (APP_TAX_RATE/100);
  const total = subtotal + taxAmount;
  const quotationNumber = "QT-" + todayStr().replace(/-/g,"") + "-" + uid().slice(0,4).toUpperCase();
  const rowsHtml = offers.map(o=>`
    <tr>
      <td>${esc(o.itemName)}</td>
      <td>${money(o.price)}</td>
      <td>${o.validUntil ? esc(o.validUntil) : "—"}</td>
    </tr>`).join("");
  document.getElementById("printArea").innerHTML = `
    <div class="print-title">${esc(businessName)}</div>
    <div class="print-sub">Price Quotation</div>
    ${(vatNumber || crNumber) ? `<div style="font-size:11px;color:#555;margin-bottom:10px">${vatNumber?`VAT No: ${esc(vatNumber)}`:""} ${vatNumber && crNumber?"· ":""} ${crNumber?`CR No: ${esc(crNumber)}`:""}</div>` : ""}
    <div class="print-meta">
      <div>Quotation ${esc(quotationNumber)}<br>${esc(todayStr())}</div>
      <div style="text-align:right">Customer:<br><b>${quotationCustomerName ? esc(quotationCustomerName) : "General"}</b>${customer && customer.taxNumber ? `<br><span style="font-size:11px">VAT: ${esc(customer.taxNumber)}</span>` : ""}</div>
    </div>
    <table class="print-table">
      <thead><tr><th>Item</th><th>Price</th><th>Valid until</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#444;margin-top:10px"><span>Subtotal</span><span>${money(subtotal)}</span></div>
    ${APP_TAX_RATE>0 ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:#444;margin-top:4px"><span>VAT (${APP_TAX_RATE}%)</span><span>${money(taxAmount)}</span></div>` : ""}
    <div class="print-total"><span>Total</span><span>${money(total)}</span></div>
  `;
  window.print();
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- boot ---------------- */
async function startApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("loadingScreen").style.display = "flex";
  try{
    await loadAll();
    setStatus(true);
  }catch(e){
    console.error(e);
    notify("Could not connect to database. Check setup.", true);
    setStatus(false);
  }
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("topbar").style.display = "block";
  document.getElementById("app").style.display = "block";
  view = "home";
  render();
}
(async function boot(){
  applyLangDirection();
  const { data } = await sb.auth.getSession();
  document.getElementById("loadingScreen").style.display = "none";
  if(data.session){
    currentUser = data.session.user;
    startApp();
  } else {
    document.getElementById("loginScreen").style.display = "flex";
  }
})();
</script>
