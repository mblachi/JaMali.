<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus POS — Sales &amp; Inventory Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0B0F14; --surface:#121822; --surface-2:#1A2230; --border:#232C3B;
    --ink:#EAF0F7; --muted:#8B97AB;
    --teal:#28E0B9; --teal-dim:#1AA184; --violet:#7C6CF6; --coral:#FF6B5E;
    --danger:#FF6B5E; --success:#28E0B9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh;
  }
  .display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:2px solid var(--teal); outline-offset:1px;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px;}

  .topbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:18px 20px; position:sticky; top:0; z-index:10;
  }
  .topbar-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .home-btn{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    color:var(--ink);padding:7px 9px;display:none;align-items:center;justify-content:center;
  }
  .home-btn.show{display:flex;}
  .logo-dot{width:10px;height:10px;border-radius:3px;background:var(--teal);display:inline-block;box-shadow:0 0 12px var(--teal);}
  .logo-dot.offline{background:var(--coral);box-shadow:0 0 12px var(--coral);}
  .topbar-title{font-size:20px;font-weight:700;letter-spacing:-.2px;}
  .topbar-date{font-size:11px;color:var(--muted);letter-spacing:.5px;}

  .container{max-width:720px;margin:0 auto;padding:0 0 48px;}
  .section{padding:20px;}

  .stat-row{display:flex;gap:12px;margin-bottom:24px;padding:20px 20px 0;}
  .stat-card{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;position:relative;overflow:hidden;
  }
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  .stat-value{font-size:24px;font-weight:700;margin-top:6px;}

  .group{margin-bottom:28px;padding:0 20px;}
  .group-title{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .group-title::after{content:"";flex:1;height:1px;background:var(--border);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 16px;
    text-align:left;display:flex;flex-direction:column;gap:12px;transition:border-color .15s, transform .15s;
  }
  .tile:hover{border-color:var(--teal-dim);}
  .tile:active{transform:scale(.98);}
  .tile-icon{
    width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);
  }
  .tile span{font-size:14px;font-weight:600;color:var(--ink);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
  .field{display:block;margin-bottom:14px;}
  .field-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;}
  .input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);font-size:15px;background:var(--surface-2);color:var(--ink);}
  .input::placeholder{color:#54606F;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  .btn-primary{
    background:var(--teal);color:#052018;border:none;border-radius:10px;padding:13px 18px;
    font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:center;width:100%;
  }
  .btn-primary:disabled{background:#2B3444;color:#5C6779;}
  .btn-add{
    background:var(--teal);color:#052018;border:none;border-radius:10px;padding:13px 18px;
    font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;
  }
  .btn-ghost{
    background:transparent;color:var(--coral);border:1px solid rgba(255,107,94,.3);border-radius:8px;
    padding:7px 11px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;
  }
  .btn-icon{background:none;border:none;color:var(--coral);display:flex;}

  .empty{text-align:center;padding:44px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:14px;margin-top:10px;}
  .empty svg{margin-bottom:8px;opacity:.6;}

  .list-row{display:flex;justify-content:space-between;align-items:center;}
  .item-name{font-weight:700;font-size:15px;}
  .item-sub{font-size:13px;color:var(--muted);margin-top:2px;}
  .amount{font-weight:700;}
  .amount-teal{color:var(--teal);}
  .amount-coral{color:var(--coral);}

  .line-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
  .line-item:last-child{border-bottom:none;}
  .line-total{display:flex;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:19px;font-weight:800;}

  .bar-row{margin-bottom:14px;}
  .bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .bar-track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:8px;border-radius:4px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);
    border:1px solid var(--teal-dim);color:var(--ink);padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;
    box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  .toast.error{border-color:var(--coral);}

  .expandable{cursor:pointer;}
  .chev{transition:transform .15s;color:var(--muted);}
  .chev.open{transform:rotate(90deg);}
  .detail-panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:none;}
  .detail-panel.open{display:block;}

  .loading-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; z-index:200;
  }
  .login-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    z-index:190; padding:20px;
  }
  .login-box{ width:100%; max-width:360px; }
  .login-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .login-tab{
    flex:1; padding:10px; text-align:center; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); font-weight:700; font-size:13px;
  }
  .login-tab.active{ background:var(--teal); color:#052018; border-color:var(--teal); }
  .link-btn{ background:none; border:none; color:var(--teal); font-size:13px; font-weight:600; text-decoration:underline; padding:0; }

  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}

  /* ---- Print / PDF invoice ---- */
  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{
      display:block; position:absolute; top:0; left:0; width:100%;
      padding:24px; color:#000; font-family:'Manrope',sans-serif;
    }
    .print-title{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-bottom:2px; }
    .print-sub{ color:#555; font-size:12px; margin-bottom:18px; }
    .print-table{ width:100%; border-collapse:collapse; margin-top:10px; }
    .print-table th, .print-table td{ text-align:left; padding:8px 4px; border-bottom:1px solid #ccc; font-size:13px; }
    .print-total{ display:flex; justify-content:space-between; margin-top:16px; padding-top:12px; border-top:2px solid #000; font-size:17px; font-weight:700; }
    .print-meta{ display:flex; justify-content:space-between; margin-bottom:14px; font-size:13px; color:#333; }
  }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <span class="logo-dot" style="width:14px;height:14px"></span>
  <div class="display" style="color:var(--muted);font-size:15px">Connecting to database…</div>
</div>

<div class="login-screen" id="loginScreen" style="display:none">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:22px">
      <span class="logo-dot" style="width:14px;height:14px"></span>
      <div class="display" style="font-size:24px;font-weight:700;margin-top:10px">Nexus POS</div>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">Staff sign in</div>
    </div>
    <div class="login-tabs">
      <button class="login-tab active" id="tabSignIn" onclick="setAuthMode('signin')">Sign In</button>
      <button class="login-tab" id="tabSignUp" onclick="setAuthMode('signup')">Create Account</button>
    </div>
    <div class="card">
      <label class="field"><div class="field-label">Email</div><input class="input" id="authEmail" type="email" placeholder="you@company.com"></label>
      <label class="field"><div class="field-label">Password</div><input class="input" id="authPassword" type="password" placeholder="••••••••"></label>
      <button class="btn-primary" id="authBtn" onclick="submitAuth()">Sign In</button>
      <div id="authError" style="color:var(--coral);font-size:13px;margin-top:10px;display:none"></div>
    </div>
  </div>
</div>

<div class="topbar" style="display:none" id="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <button class="home-btn" id="homeBtn" aria-label="Back to menu" onclick="goHome()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <span class="logo-dot" id="statusDot"></span>
      <div class="topbar-title display" id="pageTitle">Nexus POS</div>
    </div>
    <div class="topbar-date mono" id="topDate"></div>
  </div>
</div>

<div class="container" id="app" style="display:none"></div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Supabase connection ---------------- */
const SUPABASE_URL = "https://sgknnrjnalhesenzhbgm.supabase.co";
const SUPABASE_KEY = "sb_publishable_BXgm3pL37NTOWHjTu9zjPQ_SsSeWqyo";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TABLES = { items:"items", customers:"customers", suppliers:"suppliers", invoices:"invoices", purchases:"purchases", returns:"returns", expenses:"expenses" };

let DB = { items:[], customers:[], suppliers:[], invoices:[], purchases:[], returns:[], expenses:[], staff:[], salaries:[], priceOffers:[], notes:[] };
let authMode = "signin";
let currentUser = null;

function setAuthMode(mode){
  authMode = mode;
  document.getElementById("tabSignIn").classList.toggle("active", mode==="signin");
  document.getElementById("tabSignUp").classList.toggle("active", mode==="signup");
  document.getElementById("authBtn").textContent = mode==="signin" ? "Sign In" : "Create Account";
  document.getElementById("authError").style.display = "none";
}
async function submitAuth(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const errBox = document.getElementById("authError");
  errBox.style.display = "none";
  if(!email || !password){ errBox.textContent = "Email and password are required"; errBox.style.display="block"; return; }
  const btn = document.getElementById("authBtn"); btn.disabled = true;
  let result;
  if(authMode === "signin"){
    result = await sb.auth.signInWithPassword({ email, password });
  } else {
    result = await sb.auth.signUp({ email, password });
  }
  btn.disabled = false;
  if(result.error){ errBox.textContent = result.error.message; errBox.style.display = "block"; return; }
  if(authMode === "signup" && !result.data.session){
    errBox.style.color = "var(--teal)";
    errBox.textContent = "Account created. Check your email to confirm, then sign in.";
    errBox.style.display = "block";
    return;
  }
  currentUser = result.data.user;
  startApp();
}
async function signOut(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById("topbar").style.display = "none";
  document.getElementById("app").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
}

function uid(){ return Math.random().toString(36).slice(2,10); }
function money(n){ return "SAR " + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

let toastTimer;
function notify(msg, isError){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.toggle("error", !!isError); t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}

/* ---- row <-> app-shape mappers ---- */
function invoiceFromRow(r){ return {id:r.id, date:r.date, time:r.time, customerName:r.customer_name, lines:r.lines||[], total:Number(r.total)}; }
function purchaseFromRow(r){ return {id:r.id, date:r.date, supplierName:r.supplier_name, itemName:r.item_name, qty:Number(r.qty), cost:Number(r.cost), total:Number(r.total)}; }
function returnFromRow(r){ return {id:r.id, date:r.date, itemName:r.item_name, qty:Number(r.qty), reason:r.reason, refund:Number(r.refund)}; }

async function loadAll(){
  const [items, customers, suppliers, invoices, purchases, returns, expenses, staff, salaries, priceOffers, notes] = await Promise.all([
    sb.from("items").select("*").order("created_at",{ascending:false}),
    sb.from("customers").select("*").order("created_at",{ascending:false}),
    sb.from("suppliers").select("*").order("created_at",{ascending:false}),
    sb.from("invoices").select("*").order("created_at",{ascending:false}),
    sb.from("purchases").select("*").order("created_at",{ascending:false}),
    sb.from("returns").select("*").order("created_at",{ascending:false}),
    sb.from("expenses").select("*").order("created_at",{ascending:false}),
    sb.from("staff").select("*").order("created_at",{ascending:false}),
    sb.from("salaries").select("*").order("created_at",{ascending:false}),
    sb.from("price_offers").select("*").order("created_at",{ascending:false}),
    sb.from("notes").select("*").order("created_at",{ascending:false}),
  ]);
  const all = [items,customers,suppliers,invoices,purchases,returns,expenses,staff,salaries,priceOffers,notes];
  const firstErr = all.find(r=>r.error);
  if(firstErr && firstErr.error){ throw firstErr.error; }
  DB.items = items.data.map(i=>({id:i.id, name:i.name, price:Number(i.price), stock:Number(i.stock), unit:i.unit||"pc"}));
  DB.customers = customers.data.map(c=>({id:c.id, name:c.name, phone:c.phone, notes:c.notes, addedOn:c.added_on}));
  DB.suppliers = suppliers.data.map(s=>({id:s.id, name:s.name, phone:s.phone, notes:s.notes, addedOn:s.added_on}));
  DB.invoices = invoices.data.map(invoiceFromRow);
  DB.purchases = purchases.data.map(purchaseFromRow);
  DB.returns = returns.data.map(returnFromRow);
  DB.expenses = expenses.data.map(e=>({id:e.id, date:e.date, category:e.category, amount:Number(e.amount), note:e.note}));
  DB.staff = staff.data.map(s=>({id:s.id, name:s.name, role:s.role, phone:s.phone}));
  DB.salaries = salaries.data.map(s=>({id:s.id, staffId:s.staff_id, staffName:s.staff_name, amount:Number(s.amount), month:s.month, date:s.date}));
  DB.priceOffers = priceOffers.data.map(p=>({id:p.id, customerName:p.customer_name, itemName:p.item_name, price:Number(p.price), validUntil:p.valid_until, note:p.note}));
  DB.notes = notes.data.map(n=>({id:n.id, author:n.author, message:n.message, createdAt:n.created_at}));
}

function setStatus(online){
  document.getElementById("statusDot").classList.toggle("offline", !online);
}

/* ---------------- icons ---------------- */
const ICONS = {

  wallet: '<path d="M20 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 7V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2"/><path d="M17 13h.01"/>',
  briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',

  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
  chevron: '<polyline points="9 18 15 12 9 6"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
};
function icon(name, size=20, color="currentColor"){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}
const TILE_COLORS = {
  cart:"#28E0B9", search:"#28E0B9", package:"#7C6CF6", userplus:"#7C6CF6", truck:"#7C6CF6",
  wallet:"#FF6B5E", briefcase:"#FF6B5E", rotate:"#FF6B5E", trending:"#28E0B9", filebar:"#FF6B5E",
};

/* ---------------- routing ---------------- */
const MODULES = {
  sale: "New Sale", items: "Items", customers: "Customers", suppliers: "Suppliers",
  invoices: "Search Invoices", spend: "New Spend", purchases: "Purchases",
  returns: "Purchase Returns", expReport: "Expenses Report", salesReport: "Daily Sales Report",
  priceOffers: "Price Offers", supply: "Supply", staff: "Staff", salaries: "Staff Salaries",
  excelImport: "Import Excel", settings: "Settings", notes: "Messages & Notes", help: "Help",
};
let view = "home";
function goHome(){ view = "home"; render(); }
function goTo(v){ view = v; render(); }

document.getElementById("topDate").textContent = todayStr();

function render(){
  document.getElementById("pageTitle").textContent = view === "home" ? "Nexus POS" : MODULES[view];
  document.getElementById("homeBtn").classList.toggle("show", view !== "home");
  const app = document.getElementById("app");
  app.innerHTML = "";
  const renderers = {
    home: renderHome, sale: renderSale, items: renderItems, customers: ()=>renderPeople("customer"),
    suppliers: ()=>renderPeople("supplier"), invoices: renderInvoices, spend: renderSpend,
    purchases: renderPurchases, returns: renderReturns, expReport: renderExpReport, salesReport: renderSalesReport,
    priceOffers: renderPriceOffers, supply: renderSupply, staff: renderStaff, salaries: renderSalaries,
    excelImport: renderExcelImport, settings: renderSettings, notes: renderNotes, help: renderHelp,
  };
  (renderers[view] || renderHome)(app);
}

/* ---------------- HOME ---------------- */
function renderHome(app){
  const t = todayStr();
  const todaySales = DB.invoices.filter(i=>i.date===t).reduce((s,i)=>s+i.total,0);
  const todayExp = DB.expenses.filter(e=>e.date===t).reduce((s,e)=>s+Number(e.amount),0);

  app.innerHTML = `
    <div class="stat-row">

let saleLines = [];
let lastCompletedInvoiceId = null;
function renderSale(app){
  saleLines = [];
  app.innerHTML = `
    <div class="section">
      ${lastCompletedInvoiceId ? `
      <div class="card" style="border-color:var(--teal-dim)">
        <div class="list-row">
          <div class="item-sub">Last sale completed</div>
          <button class="btn-add" onclick="printInvoice('${lastCompletedInvoiceId}')">${icon("filebar",16)} Print / Save PDF</button>
        </div>
      </div>` : ""}
      <div class="card">
        ${field("Customer (optional)", `<select class="input" id="saleCustomer"><option value="">Walk-in customer</option>${DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>`)}
      </div>
      <div class="card">
        <div class="group-title" style="margin-bottom:10px">Add item</div>
        ${field("Item", `<select class="input" id="salePick"><option value="">Select item…</option>${DB.items.map(i=>`<option value="${i.id}">${esc(i.name)} — ${money(i.price)}</option>`).join("")}</select>`)}
        <div class="row" style="align-items:flex-end">
          ${field("Quantity", `<input class="input" id="saleQty" type="number" min="1" value="1">`)}
          <button class="btn-add" style="margin-bottom:14px" onclick="addSaleLine()">${icon("plus",16)} Add</button>
        </div>
      </div>
      <div id="saleLinesWrap"></div>
      <button class="btn-primary" id="completeBtn" onclick="completeSale()" disabled>${icon("save",16)} Complete sale</button>
    </div>
  `;
  renderSaleLines();
}
function addSaleLine(){
  const pick = document.getElementById("salePick").value;
  const qty = Number(document.getElementById("saleQty").value);
  const item = DB.items.find(i=>i.id===pick);
  if(!item){ notify("Choose an item", true); return; }
  if(!qty || qty<=0){ notify("Quantity must be positive", true); return; }
  saleLines.push({itemId:item.id, name:item.name, price:item.price, qty});
  document.getElementById("salePick").value = "";
  document.getElementById("saleQty").value = 1;
  renderSaleLines();
}
function removeSaleLine(idx){ saleLines.splice(idx,1); renderSaleLines(); }
function renderSaleLines(){
  const wrap = document.getElementById("saleLinesWrap");
  const total = saleLines.reduce((s,l)=>s+l.price*l.qty,0);
  document.getElementById("completeBtn").disabled = saleLines.length===0;
  if(saleLines.length===0){ wrap.innerHTML = emptyState("No items added to this sale yet."); return; }
  wrap.innerHTML = `<div class="card">
    ${saleLines.map((l,idx)=>`
      <div class="line-item">
        <div><div class="item-name" style="font-size:14px">${esc(l.name)}</div><div class="item-sub">${l.qty} × ${money(l.price)}</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="display amount">${money(l.price*l.qty)}</div>
          <button class="btn-icon" onclick="removeSaleLine(${idx})">${icon("x",16)}</button>
        </div>
      </div>`).join("")}
    <div class="line-total display"><span>Total</span><span style="color:var(--teal)">${money(total)}</span></div>
  </div>`;
}
async function completeSale(){
  if(saleLines.length===0){ notify("Add at least one item", true); return; }
  const btn = document.getElementById("completeBtn"); btn.disabled = true;
  const custId = document.getElementById("saleCustomer").value;
  const customer = DB.customers.find(c=>c.id===custId);
  const total = saleLines.reduce((s,l)=>s+l.price*l.qty,0);
  const row = {
    id:uid(), date:todayStr(), time:new Date().toISOString(),
    customer_name: customer?customer.name:"Walk-in", lines:saleLines, total,
  };
  const { error } = await sb.from("invoices").insert(row);
  if(error){ notify("Failed to save sale: "+error.message, true); btn.disabled=false; return; }

  // update stock for each affected item
  for(const line of saleLines){
    const it = DB.items.find(x=>x.id===line.itemId);
    if(it){
      const newStock = Math.max(0, it.stock - line.qty);
      const { error: stockErr } = await sb.from("items").update({stock:newStock}).eq("id", it.id);
      if(!stockErr) it.stock = newStock;
    }
  }
  DB.invoices.unshift(invoiceFromRow(row));
  lastCompletedInvoiceId = row.id;
  notify("Sale completed · "+money(total));
  renderSale(document.getElementById("app"));
}

/* ---------------- SUPPLY (quick stock-in) ---------------- */
function renderSupply(app){
  app.innerHTML = `
    <div class="section">
      <div class="card">
        <div class="item-sub" style="margin-bottom:14px">Quickly add stock to an existing item without recording a full purchase.</div>
        ${field("Item", `<select class="input" id="supItem"><option value="">Select item…</option>${DB.items.map(i=>`<option value="${i.id}">${esc(i.name)} (current: ${i.stock})</option>`).join("")}</select>`)}
        ${field("Quantity to add", `<input class="input" id="supQty" type="number" value="1">`)}
        <button class="btn-primary" id="supBtn" onclick="addSupply()">${icon("plus",16)} Add to stock</button>
      </div>
    </div>`;
}
async function addSupply(){
  const itemId = document.getElementById("supItem").value;
  const item = DB.items.find(i=>i.id===itemId);
  if(!item){ notify("Choose an item", true); return; }
  const qty = Number(document.getElementById("supQty").value || 0);
  if(qty<=0){ notify("Quantity must be positive", true); return; }
  const btn = document.getElementById("supBtn"); btn.disabled = true;
  const newStock = item.stock + qty;
  const { error } = await sb.from("items").update({stock:newStock}).eq("id", item.id);
  btn.disabled = false;
  if(error){ notify("Failed: "+error.message, true); return; }
  item.stock = newStock;
  notify(`${qty} added to ${item.name}`);
  renderSupply(document.getElementById("app"));
}

/* ---------------- EXCEL IMPORT ---------------- */
function renderExcelImport(app){
  app.innerHTML = `
    <div class="section">
      <div class="card">
        <div class="item-sub" style="margin-bottom:14px">Upload an .xlsx or .csv file with columns: <b>name, price, stock, unit</b>. New items will be added to your catalogue.</div>
        <input class="input" type="file" id="excelFile" accept=".xlsx,.xls,.csv">
        <button class="btn-primary" id="excelBtn" style="margin-top:14px" onclick="importExcel()">${icon("plus",16)} Import items</button>
      </div>
      <div id="excelResult"></div>
    </div>`;
}
function importExcel(){
  const fileInput = document.getElementById("excelFile");
  const file = fileInput.files[0];
  if(!file){ notify("Choose a file first", true); return; }
  const btn = document.getElementById("excelBtn"); btn.disabled = true;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const wb = XLSX.read(e.target.result, {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet);
      const newItems = rows.filter(r=>r.name && r.price!=null).map(r=>({
        id:uid(), name:String(r.name), price:Number(r.price), stock:Number(r.stock||0), unit:String(r.unit||"pc"),
      }));
      if(newItems.length===0){ notify("No valid rows found (need name + price columns)", true); btn.disabled=false; return; }
      const { error } = await sb.from("items").insert(newItems);
      btn.disabled = false;
      if(error){ notify("Import failed: "+error.message, true); return; }
      DB.items.unshift(...newItems);
      document.getElementById("excelResult").innerHTML = `<div class="card">${icon("save",16,"var(--teal)")} <span style="margin-left:8px">${newItems.length} items imported successfully.</span></div>`;
      notify(`${newItems.length} items imported`);
    }catch(err){
      btn.disabled = false;
      notify("Could not read file: "+err.message, true);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------------- PRINT / PDF INVOICE ---------------- */
function printInvoice(invoiceId){
  const inv = DB.invoices.find(i=>i.id===invoiceId);
  if(!inv){ notify("Invoice not found", true); return; }
  const businessName = (DB.settingsMap && DB.settingsMap.business_name) || "Nexus POS";
  const rowsHtml = inv.lines.map(l=>`
    <tr>
      <td>${esc(l.name)}</td>
      <td>${l.qty}</td>
      <td>${money(l.price)}</td>
      <td>${money(l.price*l.qty)}</td>
    </tr>`).join("");
  document.getElementById("printArea").innerHTML = `
    <div class="print-title">${esc(businessName)}</div>
    <div class="print-sub">Sales Invoice</div>
    <div class="print-meta">
      <div>Invoice #${esc(inv.id)}<br>${esc(inv.date)}</div>
      <div style="text-align:right">Customer:<br><b>${esc(inv.customerName)}</b></div>
    </div>
    <table class="print-table">
      <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="print-total"><span>Total</span><span>${money(inv.total)}</span></div>
  `;
  window.print();
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- boot ---------------- */
async function startApp(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("loadingScreen").style.display = "flex";
  try{
    await loadAll();
    setStatus(true);
  }catch(e){
    console.error(e);
    notify("Could not connect to database. Check setup.", true);
    setStatus(false);
  }
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("topbar").style.display = "block";
  document.getElementById("app").style.display = "block";
  view = "home";
  render();
}
(async function boot(){
  const { data } = await sb.auth.getSession();
  document.getElementById("loadingScreen").style.display = "none";
  if(data.session){
    currentUser = data.session.user;
    startApp();
  } else {
    document.getElementById("loginScreen").style.display = "flex";
  }
})();
</script>
